# Copy to config.yaml and edit.

# Products to watch. Short share links (s.lazada.sg/...) work too.
# Each product gets its own browser tab and is bought at most once per day.
products:
  - url: https://s.lazada.sg/s.hazsX
    name: Pokemon 30th Booster Bundle
    quantity: 2          # capped by what Lazada allows (this listing: limit 2 per person)
    max_price: 45.00     # optional: don't buy if the price is above this (scalper/price-hike guard)
  # - url: https://www.lazada.sg/products/...-i123-s456.html
  #   quantity: 1

timezone: Asia/Singapore
window:
  start: "13:00"
  end: "14:00"
prewarm_minutes: 2       # start watching a little before the window opens

# Fast mode: load the product page once, then re-run the page's own stock API call
# every fast_poll_seconds (one small request instead of a full reload).
fast_poll: true
fast_poll_seconds: 1     # lower = earlier detection, but more likely to trigger Lazada's slider check
page_refresh_minutes: 5  # full reload this often to keep the session fresh
direct_checkout: true    # on restock, open checkout directly (skips re-rendering the product page)

# Used when fast mode is off or unavailable on a page.
poll_seconds: 3          # full reload interval per tab
poll_jitter: 1           # random +/- seconds so tabs don't reload in lockstep

auto_place_order: true   # click "Place Order" on the checkout page
auto_pay: false          # also click the final "Pay Now" (card OTP / e-wallet may still need you)

headless: false          # keep the window visible so you can solve captchas / finish payment
browser_channel:         # leave empty for bundled Chromium, or "chrome" to use installed Google Chrome
profile_dir: browser-profile
state_file: state.json

# Optional phone alerts via a Telegram bot (create one with @BotFather).
telegram:
  bot_token:
  chat_id:
